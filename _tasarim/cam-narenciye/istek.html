<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>İstekler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..800&family=Host+Grotesk:wght@400..700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --ink:#2A2614;
  --ink2:#534A26;
  --mute:#665C30;
  --tomato:#9A3E06;
  --display:"Funnel Display","Host Grotesk",sans-serif;
  --text:"Host Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;background:#FBF3D9;color:var(--ink);
  font-family:var(--text);-webkit-font-smoothing:antialiased;
}

/* ---------- color field ---------- */
.field{position:absolute;inset:0;overflow:hidden;z-index:0}
.field i{position:absolute;border-radius:50%}
.f1{width:300px;height:300px;left:-110px;top:-90px;background:radial-gradient(circle at 60% 65%,#FBB868,#F39B45);filter:blur(14px);opacity:.85}
.f2{width:250px;height:250px;right:-110px;top:230px;background:radial-gradient(circle at 35% 40%,#FBE38A,#F5CE4C);filter:blur(10px);opacity:.95}
.f3{width:330px;height:330px;left:-190px;top:470px;background:radial-gradient(circle at 70% 40%,#CFE06E,#A9C646);filter:blur(12px);opacity:.8}
.f4{width:220px;height:220px;right:-40px;bottom:-90px;background:radial-gradient(circle at 40% 30%,#F7A898,#EE8676);filter:blur(12px);opacity:.85}
.f5{width:150px;height:150px;left:170px;top:88px;background:#FBDB78;filter:blur(18px);opacity:.75}
.f6{width:120px;height:120px;left:60px;top:370px;background:#F7B0A0;filter:blur(20px);opacity:.6}
.field::after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- liquid glass ---------- */
.glass{
  position:relative;
  background:linear-gradient(160deg,rgba(255,253,242,.58),rgba(255,249,228,.40));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(255,255,255,.25),
    inset 0 0 18px rgba(255,255,255,.18),
    0 10px 30px -12px rgba(110,72,10,.28);
}
.glass::before{ /* specular rim */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.15) 32%,rgba(255,255,255,0) 55%,rgba(255,255,255,.55) 88%,rgba(255,255,255,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* ---------- status ---------- */
.status{position:absolute;z-index:2;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 36px}
.time{font-family:var(--text);font-weight:600;font-size:17px}

/* ---------- header ---------- */
.head{position:absolute;z-index:2;top:60px;left:20px;right:20px;display:flex;align-items:flex-end;justify-content:space-between;height:66px}
h1{font-family:var(--display);font-weight:650;font-size:46px;line-height:1;letter-spacing:-.025em;padding-bottom:6px}
.total{text-align:right;padding-bottom:6px}
.total span{display:block;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.total b{display:block;font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-.01em;color:var(--ink)}
.total b small{font-family:var(--text);font-weight:500;font-size:24px;margin-right:2px;color:var(--tomato)}

/* ---------- segmented filter ---------- */
.seg{position:absolute;z-index:2;top:138px;left:16px;right:16px;height:58px;border-radius:29px;display:flex;padding:6px}
.seg a{flex:1 1 auto;border-radius:23px;display:grid;place-items:center;padding:0 12px;text-decoration:none;font-size:16px;font-weight:500;color:var(--ink2)}
.seg a.on{color:var(--tomato);font-weight:650;background:rgba(255,255,255,.66);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4),0 2px 8px -2px rgba(110,72,10,.2)}

/* ---------- grid ---------- */
.grid{position:absolute;z-index:2;top:212px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border-radius:28px;height:260px;padding:10px 10px 14px;display:flex;flex-direction:column}
.lens{position:relative;height:108px;border-radius:20px;display:grid;place-items:center;
  background:radial-gradient(60% 70% at 50% 62%,var(--t),transparent 72%),linear-gradient(170deg,rgba(255,255,255,.34),rgba(255,255,255,.10));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 1px 0 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.5)}
.lens svg{position:relative;filter:drop-shadow(0 3px 4px rgba(74,63,24,.14))}
.meta{padding:12px 6px 0;display:flex;flex-direction:column;flex:1}
.nm{font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-.005em}
.st{font-size:15px;color:var(--ink2);margin-top:3px}
.bot{margin-top:auto}
.pr{font-family:var(--display);font-weight:650;font-size:23px;line-height:1.1;letter-spacing:-.01em}
.pr small{font-family:var(--text);font-weight:500;font-size:19px;margin-right:1px}
.pri{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:13px;font-weight:600}
.pri.hi{color:#923A04}
.pri.lo{color:#5E542C}

/* ---------- tab bar ---------- */
.tabs{position:absolute;z-index:3;bottom:22px;left:50%;width:250px;margin-left:-125px;height:64px;border-radius:32px;display:flex;padding:5px;
  background:linear-gradient(160deg,rgba(255,253,242,.62),rgba(255,249,228,.46))}
.tabs a{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink2)}
.tabs a span{font-size:12px;font-weight:600}
.tabs a.on{color:var(--tomato);background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4),0 2px 8px -2px rgba(110,72,10,.18)}
.home{position:absolute;z-index:3;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style>
</head>
<body>

<div class="field"><i class="f1"></i><i class="f2"></i><i class="f5"></i><i class="f6"></i><i class="f3"></i><i class="f4"></i></div>

<div class="status">
  <span class="time">9:41</span>
  <svg width="74" height="14" viewBox="0 0 74 14" fill="none">

    <g stroke="#2A2614" stroke-width="1.5" stroke-linecap="round"><path d="M28.2 9.6a3.3 3.3 0 0 1 4.6 0"/><path d="M25.7 7.1a6.8 6.8 0 0 1 9.6 0"/><path d="M23.2 4.6a10.3 10.3 0 0 1 14.6 0"/></g>

    <rect x="45.5" y="1.8" width="24" height="10.6" rx="3" stroke="#2A2614" stroke-opacity=".5"/>
    <rect x="47.5" y="3.8" width="17" height="6.6" rx="1.6" fill="#2A2614"/>
    <path d="M71.6 5.6v3" stroke="#2A2614" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</div>

<header class="head">
  <h1>İstekler</h1>
  <div class="total"><span>Toplam</span><b><small>₺</small>12.740</b></div>
</header>

<nav class="seg glass" aria-label="Kategori">
  <a class="on" href="#">Hepsi</a>
  <a href="#">Giyim</a>
  <a href="#">Ev</a>
  <a href="#">Teknoloji</a>
</nav>

        <path d="M12 48c0-8 1.5-15 5-20.5 1-1.6 2.8-2.3 4.6-1.9l6.8 1.4c3.6 5.6 9.8 8.3 16.6 8.3l12 2.4c10.8 2.2 17.4 6.2 19 11.3v1.4z" fill="#fff" fill-opacity=".9"/>
        <path d="M10 49.4h68.2c0 4-2.6 6.6-6.6 6.6H16.2c-3.8 0-6.2-2.4-6.2-6.6z" fill="#F7B24A" fill-opacity=".38"/>

      </div>
    </div>
  </article>

  <article class="card glass">
    <div class="lens" style="--t:rgba(247,160,140,.34)">

        <path d="M24 16l10-5 6 9 6-9 10 5 7 50-13 4-10-5-10 5-13-4z" fill="#F7B24A" fill-opacity=".45"/>
        <path d="M24 16l-8 36 6 2 5-20M56 16l8 36-6 2-5-20"/>

        <circle cx="35.5" cy="52" r="1.1" fill="#4A3F18"/><circle cx="44.5" cy="52" r="1.1" fill="#4A3F18"/>
      </svg>
    </div>
    <div class="meta">
      <div class="nm">Trençkot</div>
      <div class="st">Mango</div>
      <div class="bot">
        <div class="pr"><small>₺</small>3.990</div>
        <div class="pri hi"><svg width="14" height="14" viewBox="0 0 14 14" fill="#9A3E06"><path d="M7 1.5l1.7 3.6 3.9.5-2.9 2.7.8 3.9L7 10.3l-3.5 1.9.8-3.9L1.4 5.6l3.9-.5z"/></svg>Öncelikli</div>
      </div>
    </div>

  <article class="card glass">

        <path d="M36 32v5h8v-5"/>

        <path d="M46 49h1.5a2.5 2.5 0 0 1 0 5H46"/>

    </div>
    <div class="meta">
      <div class="nm">Kahve makinesi</div>
      <div class="st">Trendyol</div>
      <div class="bot">
        <div class="pr"><small>₺</small>4.251</div>
        <div class="pri lo"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5E542C" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="5.3"/><path d="M7 4v3.2l2 1.3"/></svg>Bekleyebilir</div>
      </div>

  <article class="card glass">
    <div class="lens" style="--t:rgba(247,178,74,.40)">
      <svg width="94" height="94" viewBox="0 0 80 80" fill="none" stroke="#4A3F18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 46c0-18 10-30 23-30s23 12 23 30"/>

      <div class="st">Hepsiburada</div>
      <div class="bot">
        <div class="pr"><small>₺</small>2.000</div>
        <div class="pri lo"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5E542C" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="5.3"/><path d="M7 4v3.2l2 1.3"/></svg>Bekleyebilir</div>
      </div>
    </div>
