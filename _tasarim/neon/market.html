<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#101011;
  --s1:#18181A;
  --s2:#1F1F22;
  --line:rgba(255,255,255,.075);
  --line2:rgba(255,255,255,.14);
  --tx:#E3E3DE;
  --tx2:#A3A39D;
  --tx3:#82827C;
  --acc:#C8F53C;
  --accdim:rgba(200,245,60,.14);
  --sans:"Geist",sans-serif;
  --mono:"Geist Mono","JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{position:relative;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* status */
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 36px}
.time{font-weight:600;font-size:16px;letter-spacing:-.01em}

/* header */
.head{position:absolute;top:66px;left:20px;right:20px;height:104px;display:flex;align-items:flex-start;justify-content:space-between}
.head .ring{margin-top:-2px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:8px}
.eyebrow b{width:6px;height:6px;background:var(--acc);border-radius:50%}
h1{font-weight:600;font-size:42px;letter-spacing:-.045em;line-height:1;margin-top:12px}
.ring{position:relative;width:104px;height:104px}
.ring svg{position:absolute;inset:0}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n strong{font-family:var(--mono);font-weight:500;font-size:42px;letter-spacing:-.06em;line-height:1}
.ring .n span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--tx2);margin-top:4px;text-transform:uppercase}

/* add */
.add{position:absolute;top:190px;left:20px;right:20px;height:56px;display:flex;gap:8px}
.field{flex:1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.field span{font-family:var(--mono);color:var(--tx3);font-size:16px}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:var(--sans);font-size:17px;color:var(--tx)}
.field input::placeholder{color:var(--tx2)}
.plus{flex:none;width:56px;height:56px;border:0;border-radius:14px;background:var(--acc);color:#101011;display:flex;align-items:center;justify-content:center}

/* list */
.list{position:absolute;top:266px;left:20px;right:20px}
.grp + .grp{margin-top:8px}
h2{display:flex;align-items:center;gap:10px;height:34px;border-bottom:1px solid var(--line);font-weight:400}
h2 svg{flex:none;color:var(--tx2)}
h2 span{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
h2 em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--tx3)}
ul{list-style:none}
li{display:flex;align-items:center;gap:14px;height:45px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.box{flex:none;width:22px;height:22px;border:1.5px solid var(--line2);border-radius:7px}
.name{font-size:17px;letter-spacing:-.01em}
.qty{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--tx2)}

.done h2 span{color:var(--tx2)}
.done h2 em{color:var(--acc)}
.got .box{background:var(--acc);border-color:var(--acc);display:flex;align-items:center;justify-content:center}
.got .name{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.28);text-decoration-thickness:1px}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:30px;height:60px;display:flex;border-top:1px solid var(--line);background:var(--bg)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx3);text-decoration:none;position:relative}
.tabs a span{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tabs a.on{color:var(--tx)}
.tabs a.on::before{content:"";position:absolute;top:-1px;left:50%;width:28px;height:2px;margin-left:-14px;background:var(--acc)}
.tabs a.on svg{color:var(--acc)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#5E5E5A}
</style>
</head>
<body>

<div class="status">
  <span class="time">9:41</span>
  <svg width="74" height="14" viewBox="0 0 74 14" fill="none">
    <g fill="#E3E3DE"><rect x="1" y="9" width="2.4" height="3.6" rx=".6"/><rect x="5.2" y="6.6" width="2.4" height="6" rx=".6"/><rect x="9.4" y="4.2" width="2.4" height="8.4" rx=".6"/><rect x="13.6" y="1.6" width="2.4" height="11" rx=".6"/></g>
    <g stroke="#E3E3DE" stroke-width="1.5" stroke-linecap="round"><path d="M28.2 9.6a3.3 3.3 0 0 1 4.6 0"/><path d="M25.7 7.1a6.8 6.8 0 0 1 9.6 0"/><path d="M23.2 4.6a10.3 10.3 0 0 1 14.6 0"/></g>
    <circle cx="30.5" cy="12" r="1.1" fill="#E3E3DE"/>
    <rect x="45.5" y="1.8" width="24" height="10.6" rx="3" stroke="#E3E3DE" stroke-opacity=".45" stroke-width="1"/>
    <rect x="47.5" y="3.8" width="17" height="6.6" rx="1.5" fill="#E3E3DE"/>
    <path d="M71.6 5.6v3" stroke="#E3E3DE" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</div>

<header class="head">
  <div>
    <div class="eyebrow"><b></b>2 / 7 alındı</div>
    <h1>Market</h1>
  </div>
  <div class="ring">
    <svg width="104" height="104" viewBox="0 0 104 104">
      <!-- 7 segments = 7 items, 2 lit = 2 bought -->
      <circle cx="52" cy="52" r="47" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3.5"
        stroke-dasharray="36.2 6" transform="rotate(-87 52 52)"/>
      <circle cx="52" cy="52" r="47" fill="none" stroke="#C8F53C" stroke-width="3.5"
        stroke-dasharray="36.2 6 36.2 400" transform="rotate(-87 52 52)"/>
    </svg>
    <div class="n"><strong>05</strong><span>kaldı</span></div>
  </div>
</header>

<form class="add" onsubmit="return false">
  <label class="field"><span>›</span><input type="text" placeholder="Ne alacaksın?" aria-label="Ne alacaksın?"></label>
  <button class="plus" type="submit" aria-label="Ekle">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 3.5v15M3.5 11h15"/></svg>
  </button>
</form>

<main class="list">
  <section class="grp">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8c-4.4 0-7.5 2.8-7.5 6.5S7.6 21 12 21s7.5-2.8 7.5-6.5S16.4 8 12 8z"/>
        <path d="M12 8V4.5"/><path d="M12 7.5c-1.6-1.8-3.8-2-5-1.2 1.4 1.4 3.2 1.8 5 1.2zM12 7.5c1.6-1.8 3.8-2 5-1.2-1.4 1.4-3.2 1.8-5 1.2z"/>
      </svg>
      <span>Manav</span><em>02</em>
    </h2>
    <ul>
      <li><b class="box"></b><span class="name">Domates</span><span class="qty">1 kg</span></li>
      <li><b class="box"></b><span class="name">Muz</span><span class="qty">6 adet</span></li>
    </ul>
  </section>

  <section class="grp">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3h8M8.5 3v3L6 9.5V20a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5L15.5 6V3"/>
        <path d="M6 13h12"/>
      </svg>
      <span>Kahvaltılık</span><em>02</em>
    </h2>
    <ul>
      <li><b class="box"></b><span class="name">Süt</span><span class="qty">2</span></li>
      <li><b class="box"></b><span class="name">Yumurta</span><span class="qty">30'lu</span></li>
    </ul>
  </section>

  <section class="grp">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3h4v3h-4z"/><path d="M9 6h6l2 3.5V20a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9.5z"/>
        <path d="M7 12.5h10"/><circle cx="19.5" cy="4" r="1"/><circle cx="20.5" cy="7.5" r=".6"/>
      </svg>
      <span>Temizlik</span><em>01</em>
    </h2>
    <ul>
      <li><b class="box"></b><span class="name">Bulaşık deterjanı</span></li>
    </ul>
  </section>

  <section class="grp done">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.2l2.6 2.6 5-5.3"/>
      </svg>
      <span>Alındı</span><em>02</em>
    </h2>
    <ul>
      <li class="got"><b class="box"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#101011" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.3l2.6 2.6L11 4.4"/></svg></b><span class="name">Ekmek</span></li>
      <li class="got"><b class="box"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#101011" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.3l2.6 2.6L11 4.4"/></svg></b><span class="name">Beyaz peynir</span></li>
    </ul>
  </section>
</main>

<nav class="tabs">
  <a class="on" href="#">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 9h17l-1.6 10.2a1.5 1.5 0 0 1-1.5 1.3H6.6a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8 9l2.5-5.5M16 9l-2.5-5.5"/><path d="M9.5 13v4M14.5 13v4"/>
    </svg>
    <span>Market</span>
  </a>
  <a href="#">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5l2.5 5.3 5.7.7-4.2 4 1.1 5.7L12 16.4l-5.1 2.8L8 13.5l-4.2-4 5.7-.7z"/>
    </svg>
    <span>İstekler</span>
  </a>
</nav>
<div class="home"></div>

</body>
</html>
