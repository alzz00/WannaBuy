<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>İstekler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter+Tight:wght@400;500;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --paper:#F3F2EE;
  --ink:#0E0E0E;
  --ink2:#4A4A48;
  --mute:#6B6B68;
  --hair:rgba(14,14,14,.16);
  --sig:#E4380E;
  --f:"Archivo","Inter Tight",sans-serif;
  --m:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{position:relative;background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}

.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 34px}
.time{font-weight:650;font-size:16px}

.head{position:absolute;top:58px;left:var(--m);right:var(--m)}
.bar{height:6px;background:var(--ink)}
h1{padding-top:16px;font-weight:900;font-stretch:125%;font-size:66px;line-height:.8;letter-spacing:-.04em;margin-left:-2px}

/* total: label in col A, oversized figure in col B */
.total{position:absolute;top:164px;left:var(--m);right:var(--m);display:grid;grid-template-columns:116px 1fr;align-items:end}
.total small{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding-bottom:4px;line-height:1.5}
.total small i{display:block;font-style:normal;font-weight:500;letter-spacing:.04em;text-transform:none;font-size:14px;color:var(--ink2)}
.total b{font-weight:900;font-stretch:112%;font-size:50px;line-height:.8;letter-spacing:-.035em;color:var(--sig);white-space:nowrap}

/* filter */
.filt{position:absolute;top:236px;left:var(--m);right:var(--m);height:46px;display:grid;grid-template-columns:.8fr .9fr .7fr 1.2fr;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.filt a{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}
.filt a + a{border-left:1px solid var(--hair)}
.filt a.on{background:var(--ink);color:var(--paper);margin:-2px 0}

/* list */
.list{position:absolute;top:298px;left:var(--m);right:var(--m);list-style:none}
.list li{display:grid;grid-template-columns:116px 1fr;height:106px;align-items:center}
.list li + li{border-top:1px solid var(--hair)}
.pic{width:76px;height:76px;color:var(--ink)}
.txt{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;row-gap:8px;align-items:center}
.nm{grid-column:1/-1}
.st{grid-row:2}
.pri{grid-row:3;grid-column:1}
.pr{grid-row:2/4;grid-column:2;align-self:end}
.nm{font-size:18px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.pr{font-weight:850;font-stretch:112%;font-size:28px;line-height:.9;letter-spacing:-.03em;text-align:right}
.st{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.pri{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.pri::before{content:"";width:10px;height:10px;background:var(--sig)}
.pri.wait{color:var(--mute)}
.pri.wait::before{background:transparent;box-shadow:inset 0 0 0 1.6px var(--mute)}

.tabs{position:absolute;left:var(--m);right:var(--m);bottom:34px;height:58px;display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.tabs a{position:relative;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--mute);font-weight:700;font-size:16px}
.tabs a + a{padding-left:16px;border-left:1px solid var(--hair)}
.tabs a.on{color:var(--ink)}
.tabs a.on::before{content:"";position:absolute;left:0;right:0;top:-2px;height:6px;background:var(--sig)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style>
</head>
