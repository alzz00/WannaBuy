<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>İstekler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ede1; --card:#fffcf3; --ink:#1b1b1b; --ink2:#55514a; --mute:#8a857b;
  --acid:#e2fa4c; --pink:#ff63a6; --lilac:#b8a6ff; --mint:#8aedc3; --sand:#f0cf8e;
  --display:"Bricolage Grotesque","Arial Narrow",sans-serif;
  --mono:"Space Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;color:var(--ink);font-family:var(--display);
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(27,27,27,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,27,27,.055) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
  -webkit-font-smoothing:antialiased;
}
.tl{font-weight:800}

/* status bar */
.status{height:54px;position:relative}
.time{position:absolute;left:34px;top:18px;font:800 17px/1 var(--display);letter-spacing:.2px}
.sys{position:absolute;right:24px;top:19px;display:flex;gap:7px;align-items:center}

/* header */
.head{position:relative;height:70px;padding:2px 18px 0}
h1{margin:0;font-weight:800;font-size:70px;line-height:.86;font-stretch:75%;letter-spacing:-1.5px;text-transform:uppercase}
.total{display:inline-flex;align-items:baseline;gap:10px;height:46px;margin:6px 0 0 18px;padding:0 14px;
  background:var(--ink);color:var(--paper);transform:rotate(-1.8deg);box-shadow:4px 4px 0 var(--pink)}
.total > span{font:700 14px/46px var(--mono);letter-spacing:1px;text-transform:uppercase}
.total b{font-weight:800;font-size:28px;line-height:46px;font-stretch:85%;color:var(--acid)}

/* filters */
.filters{display:flex;gap:10px;padding:0 18px;margin-top:15px}
.chip{height:44px;padding:0 15px;display:flex;align-items:center;background:var(--card);border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:16px}
.chip.on{background:var(--ink);color:var(--acid);box-shadow:none;transform:translate(3px,3px)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 16px;padding:0 18px;margin-top:28px}
.card{position:relative;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.thumb{height:108px;border-bottom:3px solid var(--ink);
  background:radial-gradient(circle,rgba(27,27,27,.17) 1.2px,transparent 1.6px) 0 0/8px 8px,var(--bg)}
.thumb svg{display:block;width:100%;height:100%}
.info{padding:9px 11px 10px}
.nm{font-weight:700;font-size:18px;line-height:1.1;min-height:40px}
.st{margin-top:5px;font:700 16px/1 var(--mono);letter-spacing:.3px;text-transform:uppercase;color:var(--ink2)}
.pr{margin-top:6px;font-weight:800;font-size:27px;line-height:1;font-stretch:85%;letter-spacing:-.3px}
.pr .tl{font-size:24px;margin-right:2px}
.tag{position:absolute;top:-13px;right:-9px;height:30px;padding:0 10px;display:flex;align-items:center;
  font-weight:800;font-size:14px;letter-spacing:.6px;text-transform:uppercase;border:3px solid var(--ink)}
.tag.hi{background:var(--ink);color:var(--acid);transform:rotate(5deg);box-shadow:3px 3px 0 var(--pink)}
.tag.lo{background:var(--card);color:var(--ink);transform:rotate(-3deg)}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--ink)}
.tabs .row{display:flex;gap:10px;padding:6px 14px 0}
.tab{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:800;font-size:16px;letter-spacing:.8px;text-transform:uppercase;color:#cfc9bb}
.tab.on{background:var(--pink);color:var(--ink);border:3px solid var(--paper);box-shadow:3px 3px 0 var(--acid)}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--paper)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="hs" x="-10%" y="-10%" width="130%" height="130%">
    <feOffset in="SourceAlpha" dx="3.5" dy="3.5" result="o"/>
    <feFlood flood-color="#1b1b1b"/>
    <feComposite in2="o" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>

<div class="status">
  <span class="time">9:41</span>
  <div class="sys">
    <svg width="19" height="13" viewBox="0 0 19 13" fill="#1b1b1b"><rect x="0" y="9" width="3.4" height="4"/><rect x="5" y="6" width="3.4" height="7"/><rect x="10" y="3" width="3.4" height="10"/><rect x="15" y="0" width="3.4" height="13"/></svg>
    <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="square"><path d="M2 4.6a9.6 9.6 0 0 1 13 0"/><path d="M4.9 7.7a5.4 5.4 0 0 1 7.2 0"/><rect x="7" y="10" width="3" height="3" fill="#1b1b1b" stroke="none"/></svg>
    <svg width="29" height="14" viewBox="0 0 29 14"><rect x="1" y="1" width="23" height="12" rx="2" fill="#fffcf3" stroke="#1b1b1b" stroke-width="2"/><rect x="3.5" y="3.5" width="14" height="7" fill="#1b1b1b"/><rect x="25" y="4.5" width="3" height="5" fill="#1b1b1b"/></svg>
  </div>
</div>

<header class="head">
  <h1>İstekler</h1>
</header>
<div class="total"><span>Toplam</span><b><span class="tl">₺</span>12.740</b></div>

<div class="filters">
  <span class="chip on">Hepsi</span>
  <span class="chip">Giyim</span>
  <span class="chip">Ev</span>
  <span class="chip">Teknoloji</span>
</div>

<div class="grid">

  <article class="card">
    <div class="thumb" style="--bg:var(--pink)">
      <svg viewBox="0 -12 163 118" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <g filter="url(#hs)">
          <path d="M27 74 29 47c1-10 7-15 17-14l11 4c4-6 10-12 19-12l6 2c6 14 20 23 36 27l15 4c11 3 15 10 13 16z" fill="#fffcf3"/>
          <path d="M22 74h124a6 6 0 0 1 6 6 6 6 0 0 1-6 6H28a6 6 0 0 1-6-6z" fill="#fffcf3"/>
        </g>
        <path d="M84 33l-8 7M92 40l-8 7M101 45l-7 7M110 49l-6 7" stroke-width="2.6"/>
        <path d="M44 64c18-9 42-7 66 2" stroke-width="3"/>
        <path d="M122 74c3-7 10-11 21-10" stroke-width="2.6"/>
        <path d="M24 80h126" stroke-width="2.4" stroke-dasharray="3 5"/>
      </svg>
    </div>
    <div class="info">
      <div class="nm">Beyaz spor ayakkabı</div>
      <div class="st">Zara</div>
      <div class="pr"><span class="tl">₺</span>2.499</div>
    </div>
    <span class="tag hi">Öncelikli</span>
  </article>

  <article class="card">
    <div class="thumb" style="--bg:var(--lilac)">
      <svg viewBox="0 -12 163 118" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <g filter="url(#hs)">
          <path d="M60 14 46 22l-8 69 12 2 6-52z" fill="#f0cf8e"/>
          <path d="M103 14l14 8 8 69-12 2-6-52z" fill="#f0cf8e"/>
          <path d="M60 14h43l9 86H51z" fill="#f0cf8e"/>
        </g>
        <path d="M70 14l-8 6 14 30 5.5-4zM93 14l8 6-14 30-5.5-4z" fill="#e2b86c"/>
        <path d="M81.5 46v54" stroke-width="2.6"/>
        <path d="M53 66h57v8H53z" fill="#e2b86c"/>
        <path d="M76 63.5h11v13H76z" fill="#f0cf8e"/>
        <circle cx="74" cy="56" r="2.4" fill="#1b1b1b" stroke="none"/><circle cx="89" cy="56" r="2.4" fill="#1b1b1b" stroke="none"/>
        <circle cx="74" cy="86" r="2.4" fill="#1b1b1b" stroke="none"/><circle cx="89" cy="86" r="2.4" fill="#1b1b1b" stroke="none"/>
      </svg>
    </div>
    <div class="info">
      <div class="nm">Trençkot</div>
      <div class="st">Mango</div>
      <div class="pr"><span class="tl">₺</span>3.990</div>
    </div>
    <span class="tag hi">Öncelikli</span>
  </article>

  <article class="card">
    <div class="thumb" style="--bg:var(--mint)">
      <svg viewBox="0 -12 163 118" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
       <g transform="translate(81.5 100) scale(.9) translate(-81.5 -100)" stroke-width="3.3">
        <g filter="url(#hs)">
          <path d="M53 10h57v84H53z" fill="#fffcf3"/>
          <path d="M47 92h69v8H47z" fill="#1b1b1b"/>
        </g>
        <path d="M60 18h26v11H60z" fill="#1b1b1b"/>
        <path d="M64 23.5h6" stroke="#e2fa4c" stroke-width="2.4"/>
        <circle cx="98" cy="23.5" r="5" fill="#ff63a6"/>
        <path d="M60 38h43v48H60z" fill="#66cfa3"/>
        <path d="M72 38h19v7H72z" fill="#1b1b1b"/>
        <path d="M81.5 49v6" stroke-width="2.6" stroke-dasharray="2 4"/>
        <path d="M70 64h23v8a8 8 0 0 1-8 8h-7a8 8 0 0 1-8-8z" fill="#ff63a6"/>
        <path d="M93 67h2.5a4 4 0 0 1 0 8H93" stroke-width="2.6"/>
       </g>
      </svg>
    </div>
    <div class="info">
      <div class="nm">Kahve makinesi</div>
      <div class="st">Trendyol</div>
      <div class="pr"><span class="tl">₺</span>4.251</div>
    </div>
    <span class="tag lo">Bekleyebilir</span>
  </article>

  <article class="card">
    <div class="thumb" style="--bg:var(--acid)">
      <svg viewBox="0 -12 163 118" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M51 64V52a30.5 30.5 0 0 1 61 0v12" stroke-width="12"/>
        <path d="M51 64V52a30.5 30.5 0 0 1 61 0v12" stroke="#fffcf3" stroke-width="5"/>
        <g filter="url(#hs)">
          <rect x="57" y="60" width="10" height="32" rx="4" fill="#1b1b1b"/>
          <rect x="96" y="60" width="10" height="32" rx="4" fill="#1b1b1b"/>
          <rect x="38" y="56" width="22" height="40" rx="9" fill="#ff63a6"/>
          <rect x="103" y="56" width="22" height="40" rx="9" fill="#ff63a6"/>
        </g>
        <path d="M44 66v20M119 66v20" stroke="#fffcf3" stroke-width="2.6"/>
      </svg>
    </div>
    <div class="info">
      <div class="nm">Kulaklık</div>
      <div class="st">Hepsiburada</div>
      <div class="pr"><span class="tl">₺</span>2.000</div>
    </div>
    <span class="tag lo">Bekleyebilir</span>
  </article>

</div>

<nav class="tabs">
  <div class="row">
    <a class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cfc9bb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 10h19l-2.2 10.5H4.7z"/><path d="M7.5 10 11 3.5M16.5 10 13 3.5M9 13.5v3.6M15 13.5v3.6"/></svg>
      Market
    </a>
    <a class="tab on">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linejoin="round"><path d="M12 20.5S3.2 15.3 3.2 8.8A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.8 2.2c0 6.5-8.8 11.7-8.8 11.7z" fill="#e2fa4c"/></svg>
      İstekler
    </a>
  </div>
  <div class="home"></div>
</nav>

</body>
</html>
