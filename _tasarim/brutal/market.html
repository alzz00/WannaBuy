<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ede1; --card:#fffcf3; --ink:#1b1b1b; --ink2:#55514a; --mute:#8a857b;
  --acid:#e2fa4c; --pink:#ff63a6; --lilac:#b8a6ff; --mint:#8aedc3; --sand:#f0cf8e;
  --display:"Bricolage Grotesque","Arial Narrow",sans-serif;
  --mono:"Space Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;color:var(--ink);font-family:var(--display);
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(27,27,27,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,27,27,.055) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
  -webkit-font-smoothing:antialiased;
}

/* status bar */
.status{height:54px;position:relative}
.time{position:absolute;left:34px;top:18px;font:800 17px/1 var(--display);letter-spacing:.2px}
.sys{position:absolute;right:24px;top:19px;display:flex;gap:7px;align-items:center}

/* header */
.head{position:relative;height:76px;padding:2px 18px 0}
h1{margin:0;font-weight:800;font-size:70px;line-height:.86;font-stretch:75%;letter-spacing:-1.5px;text-transform:uppercase}
.burst{position:absolute;left:230px;top:2px;width:80px;height:80px;transform:rotate(-12deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.burst b{font:800 31px/0.85 var(--display);font-stretch:80%}
.burst span{font:700 13px/1 var(--mono);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}

/* add bar */
.add{display:flex;height:58px;margin:10px 18px 0;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:0 16px;font:500 18px var(--display);color:var(--ink)}
.add input::placeholder{color:#726d64}
.add button{width:64px;flex:none;border:0;border-left:3px solid var(--ink);background:var(--acid);display:grid;place-items:center;padding:0;cursor:pointer}

/* groups */
.group{position:relative;margin:29px 18px 0;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.label{position:absolute;top:-20px;left:12px;display:flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 8px;
  background:var(--c);border:3px solid var(--ink);transform:rotate(-2.5deg);
  font-weight:800;font-size:16px;letter-spacing:.6px;text-transform:uppercase}
.group:nth-of-type(2) .label{transform:rotate(1.8deg)}
.group:nth-of-type(3) .label{transform:rotate(-1.4deg)}
.label svg{flex:none}
ul{list-style:none;margin:0;padding:0}
.group ul{padding-top:14px}
.group li{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;border-top:2.5px solid var(--ink)}
.group li:first-child{border-top:0}
.box{flex:none;width:28px;height:28px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center}
.nm{font-weight:600;font-size:19px;line-height:1.1;font-stretch:100%}
.q{margin-left:auto;font:700 16px/1 var(--mono);padding:3px 2px 2px;
  background:linear-gradient(transparent 52%,var(--c) 52%)}

/* bought */
.done{margin:20px 18px 0;padding:8px 14px 2px;border:2.5px dashed var(--ink2)}
.done-h{display:flex;align-items:center;gap:9px;height:30px}
.done-h span{font-weight:800;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
.done-h b{display:grid;place-items:center;width:26px;height:26px;background:var(--ink);color:var(--acid);font:700 14px/1 var(--mono)}
.done li{display:flex;align-items:center;gap:14px;height:44px}
.done .box{background:var(--ink)}
.done .nm{color:#6b665d;text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:3px}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--ink)}
.tabs .row{display:flex;gap:10px;padding:6px 14px 0}
.tab{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:800;font-size:16px;letter-spacing:.8px;text-transform:uppercase;color:#cfc9bb}
.tab.on{background:var(--acid);color:var(--ink);border:3px solid var(--paper);box-shadow:3px 3px 0 var(--pink)}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--paper)}
</style>
</head>
<body>

<div class="status">
  <span class="time">9:41</span>
  <div class="sys">
    <svg width="19" height="13" viewBox="0 0 19 13" fill="#1b1b1b"><rect x="0" y="9" width="3.4" height="4"/><rect x="5" y="6" width="3.4" height="7"/><rect x="10" y="3" width="3.4" height="10"/><rect x="15" y="0" width="3.4" height="13"/></svg>
    <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="square"><path d="M2 4.6a9.6 9.6 0 0 1 13 0"/><path d="M4.9 7.7a5.4 5.4 0 0 1 7.2 0"/><rect x="7" y="10" width="3" height="3" fill="#1b1b1b" stroke="none"/></svg>
    <svg width="29" height="14" viewBox="0 0 29 14"><rect x="1" y="1" width="23" height="12" rx="2" fill="#fffcf3" stroke="#1b1b1b" stroke-width="2"/><rect x="3.5" y="3.5" width="14" height="7" fill="#1b1b1b"/><rect x="25" y="4.5" width="3" height="5" fill="#1b1b1b"/></svg>
  </div>
</div>

<header class="head">
  <h1>Market</h1>
  <div class="burst">
    <svg viewBox="0 0 92 92" width="92" height="92"><polygon points="46.0,1.0 54.2,9.9 65.5,5.5 69.1,17.1 81.2,17.9 79.3,29.9 89.9,36.0 83.0,46.0 89.9,56.0 79.3,62.1 81.2,74.1 69.1,74.9 65.5,86.5 54.2,82.1 46.0,91.0 37.8,82.1 26.5,86.5 22.9,74.9 10.8,74.1 12.7,62.1 2.1,56.0 9.0,46.0 2.1,36.0 12.7,29.9 10.8,17.9 22.9,17.1 26.5,5.5 37.8,9.9" fill="#ff63a6" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/></svg>
    <div class="t"><b>5</b><span>kaldı</span></div>
  </div>
</header>

<div class="add">
  <input type="text" placeholder="Ne alacaksın?">
  <button aria-label="Ekle">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="#1b1b1b"><rect x="10" y="1" width="6" height="24"/><rect x="1" y="10" width="24" height="6"/></svg>
  </button>
</div>

<section class="group" style="--c:var(--mint)">
  <div class="label">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="8" fill="#ff63a6"/><path d="M12 7.5 8.6 5.2M12 7.5l3.4-2.3M12 7.5V2.8M12 7.5 7.4 8.4M12 7.5l4.6.9"/><path d="M8 13.2a4 4 0 0 1 2.4-2.6" stroke="#fffcf3" stroke-width="1.8"/></svg>
    Manav
  </div>
  <ul>
    <li><i class="box"></i><span class="nm">Domates</span><span class="q">1 kg</span></li>
    <li><i class="box"></i><span class="nm">Muz</span><span class="q">6 adet</span></li>
  </ul>
</section>

<section class="group" style="--c:var(--lilac)">
  <div class="label">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round"><path d="M2.6 12.8C1.4 7.2 5.8 2.4 10.8 3.2c3.6-1.1 6.6.5 8.5 2.6 3.3 2.5 3.1 7 .4 9.1-.9 4.4-4.8 7.5-9.3 6.5C5.4 21.6 2 17.9 2.6 12.8z" fill="#fffcf3"/><circle cx="10.6" cy="11.4" r="4" fill="#e2fa4c"/><path d="M9 10.4a1.8 1.8 0 0 1 1.4-1.2" stroke-width="1.6" stroke-linecap="round"/></svg>
    Kahvaltılık
  </div>
  <ul>
    <li><i class="box"></i><span class="nm">Süt</span><span class="q">2</span></li>
    <li><i class="box"></i><span class="nm">Yumurta</span><span class="q">30'lu</span></li>
  </ul>
</section>

<section class="group" style="--c:var(--acid)">
  <div class="label">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 3h7.5v4H9z" fill="#1b1b1b"/><path d="M9 4.8H6.2"/><path d="M10.5 7h4v2.6h-4z" fill="#fffcf3"/><path d="M8.6 9.6h7.8a1.6 1.6 0 0 1 1.6 1.6v8.8a1.6 1.6 0 0 1-1.6 1.6H8.6A1.6 1.6 0 0 1 7 20v-8.8a1.6 1.6 0 0 1 1.6-1.6z" fill="#8aedc3"/><path d="M3.2 3.4h.1M2.6 6.2h.1M3.6 8.6h.1" stroke-width="2.4"/></svg>
    Temizlik
  </div>
  <ul>
    <li><i class="box"></i><span class="nm">Bulaşık deterjanı</span></li>
  </ul>
</section>

<section class="done">
  <div class="done-h"><span>Alındı</span><b>2</b></div>
  <ul>
    <li><i class="box"><svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#e2fa4c" stroke-width="3.2" stroke-linecap="square"><path d="M2 7.4 6 11 14 2.6"/></svg></i><span class="nm">Ekmek</span></li>
    <li><i class="box"><svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#e2fa4c" stroke-width="3.2" stroke-linecap="square"><path d="M2 7.4 6 11 14 2.6"/></svg></i><span class="nm">Beyaz peynir</span></li>
  </ul>
</section>

<nav class="tabs">
  <div class="row">
    <a class="tab on">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 10h19l-2.2 10.5H4.7z" fill="#ff63a6"/><path d="M7.5 10 11 3.5M16.5 10 13 3.5M9 13.5v3.6M15 13.5v3.6"/></svg>
      Market
    </a>
    <a class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cfc9bb" stroke-width="2.4" stroke-linejoin="round"><path d="M12 20.5S3.2 15.3 3.2 8.8A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.8 2.2c0 6.5-8.8 11.7-8.8 11.7z"/></svg>
      İstekler
    </a>
  </div>
  <div class="home"></div>
</nav>

</body>
</html>
