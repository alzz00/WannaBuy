<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..800&family=Host+Grotesk:wght@400..700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --ink:#F4E9EF;
  --ink2:#CDB6C4;
  --mute:#BFA8B7;
  --tomato:#FF7BB4;
  --display:"Funnel Display","Host Grotesk",sans-serif;
  --text:"Host Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;background:#140910;color:var(--ink);
  font-family:var(--text);-webkit-font-smoothing:antialiased;
}

/* ---------- color field ---------- */
.field{position:absolute;inset:0;overflow:hidden;z-index:0}
.field i{position:absolute;border-radius:50%}
.f1{width:300px;height:300px;left:-110px;top:-90px;background:radial-gradient(circle at 60% 65%,#E0379C,#9E1A6E);filter:blur(14px);opacity:.85}
.f2{width:250px;height:250px;right:-110px;top:230px;background:radial-gradient(circle at 35% 40%,#F0A04A,#B8611A);filter:blur(10px);opacity:.62}
.f3{width:330px;height:330px;left:-190px;top:470px;background:radial-gradient(circle at 70% 40%,#7A3BD1,#4A1C8C);filter:blur(12px);opacity:.85}
.f4{width:220px;height:220px;right:-40px;bottom:-90px;background:radial-gradient(circle at 40% 30%,#D23A93,#7E1F74);filter:blur(12px);opacity:.8}
.f5{width:150px;height:150px;left:170px;top:88px;background:#6A2FB8;filter:blur(18px);opacity:.7}
.f6{width:120px;height:120px;left:60px;top:370px;background:#E88A3A;filter:blur(20px);opacity:.35}
.field::after{content:"";position:absolute;inset:0;opacity:.14;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- liquid glass ---------- */
.glass{
  position:relative;
  background:linear-gradient(160deg,rgba(50,26,44,.54),rgba(22,11,20,.5));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:
    inset 0 1px 0 rgba(255,236,246,.42),
    inset 0 -1px 0 rgba(255,220,240,.10),
    inset 0 0 20px rgba(255,140,200,.07),
    0 14px 34px -12px rgba(0,0,0,.6);
}
.glass::before{ /* specular rim */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,240,248,.85),rgba(255,200,230,.14) 32%,rgba(255,255,255,0) 55%,rgba(255,190,120,.35) 88%,rgba(255,225,190,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* ---------- status ---------- */
.status{position:absolute;z-index:2;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 36px}
.time{font-family:var(--text);font-weight:600;font-size:17px}

/* ---------- header ---------- */
.head{position:absolute;z-index:2;top:60px;left:20px;right:16px;display:flex;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:650;font-size:46px;line-height:1;letter-spacing:-.025em}
.orb{width:66px;height:66px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.orb b{font-family:var(--display);font-weight:650;font-size:27px;line-height:1;color:var(--tomato)}
.orb span{font-size:12px;font-weight:600;color:var(--ink2);margin-top:1px}

/* ---------- add ---------- */
.add{position:absolute;z-index:2;top:138px;left:16px;right:16px;height:58px;border-radius:29px;display:flex;align-items:center;padding:0 7px 0 22px}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:var(--text);font-size:17px;color:var(--ink)}
.add input::placeholder{color:var(--mute)}
.plus{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(120% 90% at 30% 20%,#FF8EC2,#D93A86);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(90,0,50,.3),0 0 18px -2px rgba(255,90,170,.55),0 6px 14px -6px rgba(0,0,0,.6)}

/* ---------- list ---------- */
.list{position:absolute;z-index:2;top:210px;left:16px;right:16px}
.panel{border-radius:28px;padding:8px 18px 6px}
.panel + .panel{margin-top:9px}
h2{display:flex;align-items:center;gap:10px;height:34px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--ink2)}
h2 .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,200,230,.10);box-shadow:inset 0 1px 0 rgba(255,235,245,.35),0 1px 3px rgba(0,0,0,.3)}
ul{list-style:none}
li{display:flex;align-items:center;gap:14px;height:46px}
.panel li + li{border-top:1px solid rgba(255,220,240,.10)}
.ring{flex:none;width:26px;height:26px;border-radius:50%;border:1.6px solid rgba(230,200,218,.6);background:rgba(255,220,240,.06)}
.name{flex:1;font-size:18px;font-weight:500;letter-spacing:-.005em}
.qty{font-size:16px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- done ---------- */
.done{margin-top:10px;border-radius:26px;padding:6px 18px 4px;background:linear-gradient(160deg,rgba(40,20,36,.40),rgba(20,10,18,.32))}
h3{display:flex;align-items:center;gap:8px;height:32px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink2)}
h3 em{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:rgba(255,123,180,.16);color:var(--tomato);box-shadow:inset 0 1px 0 rgba(255,220,240,.35)}
.done li{height:42px}
.tick{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,123,180,.14);box-shadow:inset 0 1px 0 rgba(255,220,240,.35)}
.done .name{color:#B9A1B0;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:rgba(185,161,176,.7)}

/* ---------- tab bar ---------- */
.tabs{position:absolute;z-index:3;bottom:22px;left:50%;width:250px;margin-left:-125px;height:64px;border-radius:32px;display:flex;padding:5px;
  background:linear-gradient(160deg,rgba(56,30,50,.56),rgba(26,13,24,.5))}
.tabs a{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink2)}
.tabs a span{font-size:12px;font-weight:600}
.tabs a.on{color:var(--tomato);background:rgba(255,123,180,.14);box-shadow:inset 0 1px 0 rgba(255,225,240,.4),inset 0 -1px 0 rgba(255,200,230,.1),0 0 14px -4px rgba(255,100,175,.45)}
.home{position:absolute;z-index:3;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style>
</head>
<body>

<div class="field"><i class="f1"></i><i class="f2"></i><i class="f5"></i><i class="f6"></i><i class="f3"></i><i class="f4"></i></div>

<div class="status">
  <span class="time">9:41</span>
  <svg width="74" height="14" viewBox="0 0 74 14" fill="none">
    <g fill="#F4E9EF"><rect x="1" y="9" width="2.4" height="3.6" rx=".6"/><rect x="5.2" y="6.6" width="2.4" height="6" rx=".6"/><rect x="9.4" y="4.2" width="2.4" height="8.4" rx=".6"/><rect x="13.6" y="1.6" width="2.4" height="11" rx=".6"/></g>
    <g stroke="#F4E9EF" stroke-width="1.5" stroke-linecap="round"><path d="M28.2 9.6a3.3 3.3 0 0 1 4.6 0"/><path d="M25.7 7.1a6.8 6.8 0 0 1 9.6 0"/><path d="M23.2 4.6a10.3 10.3 0 0 1 14.6 0"/></g>
    <circle cx="30.5" cy="12" r="1.1" fill="#F4E9EF"/>
    <rect x="45.5" y="1.8" width="24" height="10.6" rx="3" stroke="#F4E9EF" stroke-opacity=".5"/>
    <rect x="47.5" y="3.8" width="17" height="6.6" rx="1.6" fill="#F4E9EF"/>
    <path d="M71.6 5.6v3" stroke="#F4E9EF" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</div>

<header class="head">
  <h1>Market</h1>
  <div class="orb glass"><b>5</b><span>kaldı</span></div>
</header>

<form class="add glass" onsubmit="return false">
  <input type="text" placeholder="Ne alacaksın?" aria-label="Ne alacaksın?">
  <button class="plus" type="submit" aria-label="Ekle">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2A0B1D" stroke-width="2.4" stroke-linecap="round"><path d="M10 3.5v13M3.5 10h13"/></svg>
  </button>
</form>

<main class="list">
  <section class="panel glass">
    <h2><span class="ic">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7BB4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8.2c-4.2 0-7 2.6-7 6.2S7.9 21 12 21s7-3 7-6.6-2.8-6.2-7-6.2z" fill="#FF7BB4" fill-opacity=".18"/>
        <path d="M12 8.2V5.4M9 6.6c1 1.2 2 1.6 3 1.6s2-.4 3-1.6M12 5.4c.8-1.2 2-1.9 3.4-2"/>
      </svg></span>Manav</h2>
    <ul>
      <li><b class="ring"></b><span class="name">Domates</span><span class="qty">1 kg</span></li>
      <li><b class="ring"></b><span class="name">Muz</span><span class="qty">6 adet</span></li>
    </ul>
  </section>

  <section class="panel glass">
    <h2><span class="ic">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7BB4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2.8h5M10 2.8v3.4L7.6 9.4c-.4.5-.6 1.1-.6 1.7V20a1.2 1.2 0 0 0 1.2 1.2h7.6A1.2 1.2 0 0 0 17 20v-8.9c0-.6-.2-1.2-.6-1.7L14 6.2V2.8"/>
        <path d="M7 13.4h10V20a1.2 1.2 0 0 1-1.2 1.2H8.2A1.2 1.2 0 0 1 7 20z" fill="#FF7BB4" fill-opacity=".18" stroke="none"/>
        <path d="M7 13.4h10"/>
      </svg></span>Kahvaltılık</h2>
    <ul>
      <li><b class="ring"></b><span class="name">Süt</span><span class="qty">2</span></li>
      <li><b class="ring"></b><span class="name">Yumurta</span><span class="qty">30'lu</span></li>
    </ul>
  </section>

  <section class="panel glass">
    <h2><span class="ic">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7BB4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3h4v3h-4zM9 6h6l1.6 3.4c.3.6.4 1.2.4 1.8V20a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-8.8c0-.6.1-1.2.4-1.8z"/>
        <path d="M7 12.5h10v5H7z" fill="#FF7BB4" fill-opacity=".18" stroke="none"/>
        <circle cx="19.2" cy="4.6" r="1.3"/><circle cx="20.6" cy="7.9" r=".7"/>
      </svg></span>Temizlik</h2>
    <ul>
      <li><b class="ring"></b><span class="name">Bulaşık deterjanı</span></li>
    </ul>
  </section>

  <section class="done glass">
    <h3>Alındı <em>2</em></h3>
    <ul>
      <li><span class="tick"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FF7BB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4l3 3 6-6.6"/></svg></span><span class="name">Ekmek</span></li>
      <li><span class="tick"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FF7BB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4l3 3 6-6.6"/></svg></span><span class="name">Beyaz peynir</span></li>
    </ul>
  </section>
</main>

<nav class="tabs glass">
  <a class="on" href="#">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 9.5h17l-1.8 9.6a1.6 1.6 0 0 1-1.6 1.3H6.9a1.6 1.6 0 0 1-1.6-1.3z" fill="currentColor" fill-opacity=".16"/>
      <path d="M8 9.5l3-6M16 9.5l-3-6M9.5 13v4M14.5 13v4"/>
    </svg>
    <span>Market</span>
  </a>
  <a href="#">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20.3S3.8 15.6 3.8 9.4A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 8.2 2.2c0 6.2-8.2 10.9-8.2 10.9z"/>
    </svg>
    <span>İstekler</span>
  </a>
</nav>
<div class="home"></div>

</body>
</html>
