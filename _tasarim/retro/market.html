<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Shrikhand&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3E2BF;
  --paper:#FCF3DF;
  --mustard:#E3A52A;
  --orange:#D5632A;
  --rust:#A23D1F;
  --choc:#3A2115;
  --choc2:#6B4834;
  --muted:#7E5F44;
  --avocado:#7C7B2D;
}
*{box-sizing:border-box}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;
  background:var(--cream);
  color:var(--choc);
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 100,'WONK' 0;
  -webkit-font-smoothing:antialiased;
}
/* paper grain */
body::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .32 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* ---------- status bar ---------- */
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:5}
.status .time{
  position:absolute;left:34px;top:15px;
  font-weight:700;font-size:17px;letter-spacing:.01em;
  font-variation-settings:'SOFT' 100,'WONK' 0,'opsz' 20;
}
.status .icons{position:absolute;right:24px;top:19px}

/* ---------- header ---------- */
.swoosh{position:absolute;left:0;top:0;width:390px;height:200px;pointer-events:none}
.title{
  position:absolute;left:20px;top:74px;margin:0;
  font-family:'Shrikhand',serif;font-weight:400;font-size:52px;line-height:1;
  color:var(--choc);letter-spacing:.005em;
  text-shadow:3px 3px 0 var(--orange),6px 6px 0 var(--mustard);
}
.sun{position:absolute;left:262px;top:52px;width:88px;height:88px;transform:rotate(-9deg)}
.sun svg{position:absolute;inset:0}
.sun .n{
  position:absolute;left:0;right:0;top:14px;text-align:center;
  font-weight:900;font-size:37px;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 72;
}
.sun .l{
  position:absolute;left:0;right:0;top:51px;text-align:center;line-height:1;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;
  font-variation-settings:'wdth' 85,'opsz' 14;letter-spacing:.02em;
}

/* ---------- add field ---------- */
.add{
  position:absolute;left:20px;right:20px;top:188px;height:54px;
  border:2.5px solid var(--choc);border-radius:27px;background:var(--paper);
  display:flex;align-items:center;padding:0 5px 0 22px;
}
.add .ph{
  flex:1;font-style:italic;font-weight:400;font-size:18px;color:var(--muted);
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 18;
}
.add .btn{
  width:44px;height:44px;border-radius:50%;background:var(--orange);
  border:2.5px solid var(--choc);display:grid;place-items:center;
}

/* ---------- list ---------- */
.list{position:absolute;left:20px;right:20px;top:257px}
/* header icon centred on the checkbox column, label on the item-name column */
.gh{display:flex;align-items:center;height:28px;margin:0 0 6px 13.5px;gap:14px}
.gh .lbl{
  font-style:italic;font-weight:700;font-size:20px;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 24;
}
.gh .rule{flex:1;height:8px;margin-left:0;
  background:linear-gradient(var(--mustard) 0 2px,transparent 2px 3px,var(--orange) 3px 5px,transparent 5px 6px,var(--rust) 6px 8px);
  border-radius:2px;opacity:.9}
.grp{margin-bottom:10px}
.row{
  height:50px;border:2.5px solid var(--choc);border-radius:25px;background:var(--paper);
  display:flex;align-items:center;padding:0 20px 0 10px;margin-bottom:6px;
}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--choc);background:var(--cream);flex:none;margin-right:13px}
.nm{flex:1;font-weight:500;font-size:18px;line-height:1;white-space:nowrap;
  font-variation-settings:'SOFT' 100,'WONK' 0,'opsz' 18}
.qty{font-style:italic;font-weight:500;font-size:16px;color:var(--rust);
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 16}

.gh.done .lbl{color:var(--choc2)}
.gh .cnt{margin-left:-6px;font-style:italic;font-weight:500;font-size:18px;color:var(--muted);
  font-variation-settings:'SOFT' 100,'WONK' 1}
.gh.done .rule{opacity:.35}
.donerow{display:flex;gap:8px}
.dn{
  height:44px;border:2px dashed var(--muted);border-radius:22px;
  display:flex;align-items:center;padding:0 18px 0 11.5px;color:var(--choc2);
}
.dn .ok{width:26px;height:26px;border-radius:50%;background:var(--orange);border:2px solid var(--choc);
  display:grid;place-items:center;margin-right:10px;flex:none}
.dn span{font-size:17px;font-weight:500;text-decoration:line-through;text-decoration-thickness:2px;
  text-decoration-color:var(--orange);font-variation-settings:'SOFT' 100,'WONK' 0,'opsz' 17}

/* ---------- tab bar ---------- */
/* 92px bar: stripes 752-761, tabs 764-808, bottom 34px safe area left clear */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;z-index:4;
  background:linear-gradient(var(--mustard) 0 3px,var(--orange) 3px 6px,var(--rust) 6px 9px,var(--choc) 9px)}
.tabs{display:flex;height:44px;margin-top:12px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  font-style:italic;font-weight:600;font-size:17px;color:rgba(243,226,191,.62);
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 18}
.tab .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.tab.on{color:var(--mustard)}
.tab.on .ic{background:var(--mustard)}
.home{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(243,226,191,.75)}
</style>
</head>
<body>

<!-- status bar -->
<div class="status">
  <div class="time">9:41</div>
  <svg class="icons" width="74" height="14" viewBox="0 0 74 14" aria-hidden="true">
    <g fill="#3A2115">
      <rect x="0" y="9" width="3.4" height="4.5" rx="1.7"/>
      <rect x="5" y="6.5" width="3.4" height="7" rx="1.7"/>
      <rect x="10" y="4" width="3.4" height="9.5" rx="1.7"/>
      <rect x="15" y="1.5" width="3.4" height="12" rx="1.7"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-width="2.2">
      <path d="M26 6.2a10 10 0 0 1 14 0" stroke="#A23D1F"/>
      <path d="M28.6 8.8a6.2 6.2 0 0 1 8.8 0" stroke="#D5632A"/>
      <path d="M31.3 11.4a2.4 2.4 0 0 1 3.4 0" stroke="#E3A52A"/>
    </g>
    <rect x="46" y="1.5" width="24" height="11.5" rx="5.75" fill="none" stroke="#3A2115" stroke-width="1.6"/>
    <rect x="48.4" y="3.9" width="17" height="6.7" rx="3.35" fill="#3A2115"/>
    <path d="M71.8 5.3v4" stroke="#3A2115" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</div>

<!-- header swoosh: three 70s stripes curling around the sun -->
<svg class="swoosh" viewBox="0 0 390 200" aria-hidden="true">
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M-10 148H306A52 52 0 0 0 358 96V80" stroke="#E3A52A"/>
    <path d="M-10 159H306A63 63 0 0 0 369 96V80" stroke="#D5632A"/>
    <path d="M-10 170H306A74 74 0 0 0 380 96V80" stroke="#A23D1F"/>
  </g>
</svg>

<h1 class="title">Market</h1>

<div class="sun">
  <svg viewBox="0 0 100 100" width="88" height="88" aria-hidden="true">
    <polygon points="50,4 55.76,9.91 62.96,5.86 66.82,13.16 74.87,11.3 76.52,19.39 84.76,19.88 84.07,28.1 91.84,30.89 88.86,38.59 95.53,43.45 90.5,50 95.53,56.55 88.86,61.41 91.84,69.11 84.07,71.9 84.76,80.12 76.52,80.61 74.87,88.7 66.82,86.84 62.96,94.14 55.76,90.09 50,96 44.24,90.09 37.04,94.14 33.18,86.84 25.13,88.7 23.48,80.61 15.24,80.12 15.93,71.9 8.16,69.11 11.14,61.41 4.47,56.55 9.5,50 4.47,43.45 11.14,38.59 8.16,30.89 15.93,28.1 15.24,19.88 23.48,19.39 25.13,11.3 33.18,13.16 37.04,5.86 44.24,9.91" fill="#E3A52A" stroke="#3A2115" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#3A2115" stroke-width="1.4"/>
  </svg>
  <div class="n">5</div>
  <div class="l">kaldı</div>
</div>

<!-- add -->
<div class="add">
  <div class="ph">Ne alacaksın?</div>
  <div class="btn">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14" stroke="#FCF3DF" stroke-width="3.2" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="list">

  <div class="grp">
    <div class="gh">
      <!-- tomato -->
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M13 7.5c-5.6 0-9.5 3.4-9.5 8 0 4.3 4 7.5 9.5 7.5s9.5-3.2 9.5-7.5c0-4.6-3.9-8-9.5-8z" fill="#D5632A" stroke="#3A2115" stroke-width="2" stroke-linejoin="round"/>
        <path d="M13 3.5v4.5M8.5 7.2c1.8 1.6 3 1.6 4.5.3 1.5 1.3 2.7 1.3 4.5-.3" fill="none" stroke="#3A2115" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 14.5c.4-1.8 1.6-3 3.2-3.6" fill="none" stroke="#FCF3DF" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="lbl">Manav</span><span class="rule"></span>
    </div>
    <div class="row"><span class="ck"></span><span class="nm">Domates</span><span class="qty">1 kg</span></div>
    <div class="row"><span class="ck"></span><span class="nm">Muz</span><span class="qty">6 adet</span></div>
  </div>

  <div class="grp">
    <div class="gh">
      <!-- tulip tea glass -->
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M8.6 9.2h8.8c-.3 1.9-1.8 3.2-1.8 5.2 0 2.2 2.2 3.3 2.2 6.4H8.2c0-3.1 2.2-4.2 2.2-6.4 0-2-1.5-3.3-1.8-5.2z" fill="#D5632A"/>
        <path d="M8 4.5h10c0 3-2.4 4.8-2.4 9.9 0 2.2 2.2 3.3 2.2 6.4H8.2c0-3.1 2.2-4.2 2.2-6.4C10.4 9.3 8 7.5 8 4.5z" fill="none" stroke="#3A2115" stroke-width="2" stroke-linejoin="round"/>
        <path d="M3.5 22.6c2.6 1.2 16.4 1.2 19 0" fill="none" stroke="#3A2115" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="lbl">Kahvaltılık</span><span class="rule"></span>
    </div>
    <div class="row"><span class="ck"></span><span class="nm">Süt</span><span class="qty">2</span></div>
    <div class="row"><span class="ck"></span><span class="nm">Yumurta</span><span class="qty">30'lu</span></div>
  </div>

  <div class="grp">
    <div class="gh">
      <!-- soap bubbles -->
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="10" cy="15.5" r="7" fill="#FCF3DF" stroke="#3A2115" stroke-width="2"/>
        <circle cx="19.5" cy="8.5" r="4" fill="#E3A52A" stroke="#3A2115" stroke-width="2"/>
        <circle cx="20" cy="18.5" r="2.4" fill="#D5632A" stroke="#3A2115" stroke-width="1.8"/>
        <path d="M6.6 13.8c.5-1.5 1.6-2.5 3-2.9" fill="none" stroke="#3A2115" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="lbl">Temizlik</span><span class="rule"></span>
    </div>
    <div class="row"><span class="ck"></span><span class="nm">Bulaşık deterjanı</span><span class="qty"></span></div>
  </div>

  <div class="grp">
    <div class="gh done">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="9.5" fill="none" stroke="#6B4834" stroke-width="2"/>
        <path d="M8.6 13.4l3 3 5.8-6.4" fill="none" stroke="#D5632A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="lbl">Alındı</span><span class="cnt">2</span><span class="rule"></span>
    </div>
    <div class="donerow">
      <div class="dn"><span class="ok"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.3l2.6 2.6L11 4.2" fill="none" stroke="#FCF3DF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Ekmek</span></div>
      <div class="dn"><span class="ok"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.3l2.6 2.6L11 4.2" fill="none" stroke="#FCF3DF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Beyaz peynir</span></div>
    </div>
  </div>

</div>

<!-- tab bar -->
<nav class="tabbar">
  <div class="tabs">
    <div class="tab on">
      <span class="ic">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 10c0-3.6 2.2-5.6 5-5.6s5 2 5 5.6" fill="none" stroke="#3A2115" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M2.8 10h18.4l-2 9.4c-.2 1-1 1.6-2 1.6H6.8c-1 0-1.8-.6-2-1.6z" fill="#FCF3DF" stroke="#3A2115" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M9 13.5v4M12 13.5v4M15 13.5v4" stroke="#3A2115" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Market</span>
    </div>
    <div class="tab">
      <span class="ic">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20.2C5.6 15.8 3 12.4 3 8.9 3 6.2 5 4.2 7.6 4.2c1.9 0 3.4 1 4.4 2.7 1-1.7 2.5-2.7 4.4-2.7 2.6 0 4.6 2 4.6 4.7 0 3.5-2.6 6.9-9 11.3z" fill="none" stroke="rgba(243,226,191,.62)" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>İstekler</span>
    </div>
  </div>
  <div class="home"></div>
</nav>

</body>
</html>
