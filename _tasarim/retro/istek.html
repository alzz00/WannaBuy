<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>İstekler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Shrikhand&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3E2BF;
  --paper:#FCF3DF;
  --mustard:#E3A52A;
  --orange:#D5632A;
  --rust:#A23D1F;
  --choc:#3A2115;
  --choc2:#6B4834;
  --muted:#957659;
}
*{box-sizing:border-box}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;
  background:var(--cream);
  color:var(--choc);
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 100,'WONK' 0;
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .32 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* ---------- status bar ---------- */
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:5}
.status .time{
  position:absolute;left:34px;top:15px;
  font-weight:700;font-size:17px;letter-spacing:.01em;
  font-variation-settings:'SOFT' 100,'WONK' 0,'opsz' 20;
}
.status .icons{position:absolute;right:24px;top:19px}

/* ---------- header ---------- */
.swoosh{position:absolute;left:0;top:0;width:390px;height:200px;pointer-events:none}
.title{
  position:absolute;left:20px;top:74px;margin:0;
  font-family:'Shrikhand',serif;font-weight:400;font-size:52px;line-height:1;
  color:var(--choc);letter-spacing:.005em;
  text-shadow:3px 3px 0 var(--orange),6px 6px 0 var(--mustard);
}
.sun{position:absolute;left:262px;top:52px;width:88px;height:88px;transform:rotate(-9deg)}
.sun svg{position:absolute;inset:0}

/* ---------- total ---------- */
.total{
  position:absolute;left:20px;right:20px;top:188px;height:54px;
  border:2.5px solid var(--choc);border-radius:27px;background:var(--choc);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 24px;
}
.total .k{font-style:italic;font-weight:500;font-size:18px;color:var(--mustard);
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 18}
.total .v{font-weight:900;font-size:27px;line-height:1;color:var(--paper);letter-spacing:-.005em;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 48}
.total .v .tl{color:var(--mustard);margin-right:1px}

/* ---------- filters ---------- */
.filters{position:absolute;left:20px;right:20px;top:256px;height:44px;display:flex;align-items:center;justify-content:space-between}
.chip{height:44px;display:flex;align-items:center;padding:0;font-weight:500;font-size:17px;
  font-variation-settings:'SOFT' 100,'WONK' 0,'opsz' 17;color:var(--choc)}
/* active = mustard, same as the active tab; chocolate text keeps ~7:1 contrast */
.chip.on{padding:0 21px;border:2.5px solid var(--choc);border-radius:22px;background:var(--mustard);color:var(--choc);font-weight:700}
/* invisible hit area so even "Ev" is >= 44px wide without changing the layout */
.chip:not(.on){position:relative}
.chip:not(.on)::before{content:"";position:absolute;top:0;bottom:0;left:-12px;right:-12px}
.spark{flex:none}

/* ---------- list ---------- */
.list{position:absolute;left:20px;right:20px;top:314px}
.gh{display:flex;align-items:center;height:28px;margin:0 0 6px 6px;gap:12px}
.gh .lbl{
  font-style:italic;font-weight:700;font-size:20px;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 24;
}
.gh .rule{flex:1;height:8px;margin-left:2px;
  background:linear-gradient(var(--mustard) 0 2px,transparent 2px 3px,var(--orange) 3px 5px,transparent 5px 6px,var(--rust) 6px 8px);
  border-radius:2px;opacity:.9}
.grp{margin-bottom:12px}
.wr{
  height:78px;border:2.5px solid var(--choc);border-radius:38px;background:var(--paper);
  display:flex;align-items:center;padding:0 20px 0 5.5px;margin-bottom:8px;
}
.th{width:60px;height:60px;border-radius:50%;border:2.5px solid var(--choc);overflow:hidden;flex:none}
.th svg{display:block;width:100%;height:100%}
.info{flex:1;min-width:0;margin-left:13px}
.nm{font-weight:600;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variation-settings:'SOFT' 100,'WONK' 0,'opsz' 18}
.sub{display:flex;align-items:baseline;justify-content:space-between;margin-top:5px}
.st{font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:16px;color:var(--choc2);
  font-variation-settings:'wdth' 90,'opsz' 16}
.pr{flex:none;margin-left:10px;font-weight:800;font-size:21px;line-height:1;
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 30}
.pr .tl{color:var(--rust);font-size:.86em;margin-right:1px}

/* ---------- tab bar ---------- */
/* 92px bar: stripes 752-761, tabs 764-808, bottom 34px safe area left clear */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;z-index:4;
  background:linear-gradient(var(--mustard) 0 3px,var(--orange) 3px 6px,var(--rust) 6px 9px,var(--choc) 9px)}
.tabs{display:flex;height:44px;margin-top:12px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  font-style:italic;font-weight:600;font-size:17px;color:rgba(243,226,191,.62);
  font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 18}
.tab .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.tab.on{color:var(--mustard)}
.tab.on .ic{background:var(--mustard)}
.home{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(243,226,191,.75)}
</style>
</head>
