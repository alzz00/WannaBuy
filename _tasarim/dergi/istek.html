<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>İstekler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<!-- Bodoni Moda has no Turkish lira sign; borrow only that glyph from a matching high-contrast Didone -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;1,400&text=%E2%82%BA&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EADC;
  --ink:#231E1A;
  --ink2:#6A6056;
  --mute:#8E8376;
  --rule:rgba(35,30,26,.2);
  --ox:#7C2332;
  --serif:"Bodoni Moda","Didot","Bodoni 72",serif;
  --sans:"Jost","Futura",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .11  0 0 0 0 .08  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.16;mix-blend-mode:multiply;
}
body::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(120,90,60,.07) 100%);
}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 34px}
.time{font-family:var(--sans);font-weight:500;font-size:16px;letter-spacing:.02em}
.sys{display:block}

.mast{position:absolute;top:56px;left:24px;right:24px}
.scotch{height:6px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
h1{font-weight:400;font-size:78px;line-height:.92;letter-spacing:-.03em;font-variation-settings:"opsz" 96;padding-top:30px}

.total{display:flex;align-items:baseline;gap:12px;height:48px;padding-top:4px}
.total > span{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.total .lead{flex:1;height:4px;align-self:auto;background:radial-gradient(circle,var(--mute) .85px,transparent 1.15px) 0 50%/6px 4px repeat-x}
.total em{font-style:italic;font-size:38px;line-height:1;color:var(--ox);font-variation-settings:"opsz" 40;letter-spacing:-.005em}
.cur{font-family:"Noto Serif Display",var(--serif);font-size:.6em;margin-right:.1em;position:relative;top:-.36em}

.filter{position:absolute;top:212px;left:24px;right:24px;height:44px;display:flex;align-items:stretch;justify-content:space-between;border-top:1px solid var(--rule);border-bottom:1px solid var(--ink)}
.filter a{display:flex;align-items:center;justify-content:center;min-width:44px;padding:0 10px;text-decoration:none;font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);position:relative}
.filter a:first-child{margin-left:-10px}
.filter a:last-child{margin-right:-10px;padding-right:calc(10px - .2em)}
.filter a.on{color:var(--ink)}
.filter a.on::after{content:"";position:absolute;left:10px;right:calc(10px + .2em);bottom:-1px;height:2px;background:var(--ox)}

.grid{position:absolute;top:256px;left:24px;right:24px;height:494px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.item{display:flex;flex-direction:column;padding:12px 0 14px 0;min-width:0}
.item:nth-child(odd){padding-right:14px;border-right:1px solid var(--rule)}
.item:nth-child(even){padding-left:14px}
.item:nth-child(-n+2){border-bottom:1px solid var(--rule)}
.meta{display:flex;align-items:baseline;justify-content:space-between;height:18px}
.meta i{font-style:italic;font-size:16px;color:var(--ox);font-variation-settings:"opsz" 20}
.meta b{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.2em;margin-right:-.2em;text-transform:uppercase;color:var(--ink2)}
.meta b.hi{color:var(--ox)}
.meta b.hi::before{content:"";display:inline-block;width:6px;height:6px;background:var(--ox);transform:rotate(45deg) translateY(-1px);margin-right:7px}
.art{display:block;width:100%;height:82px;margin:5px 0 8px}
.nm{font-size:19px;line-height:1.12;font-variation-settings:"opsz" 24}
.st{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-top:7px}
.pr{margin-top:auto;font-size:33px;line-height:1;letter-spacing:-.005em;font-variation-settings:"opsz" 28}

.tabs{position:absolute;left:0;right:0;bottom:34px;height:52px;display:flex;padding:0 24px}
.tabs::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:var(--ink)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:6px;color:var(--mute);text-decoration:none}
.tabs a span{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;padding-left:.24em;position:relative}
.tabs a.on{color:var(--ink)}
.tabs a.on span::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:2px;margin-left:-9px;background:var(--ox)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style>
</head>
