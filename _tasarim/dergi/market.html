<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --paper:#F2EADC;
  --ink:#231E1A;
  --ink2:#6A6056;
  --mute:#8E8376;
  --rule:rgba(35,30,26,.2);
  --ox:#7C2332;
  --serif:"Bodoni Moda","Didot","Bodoni 72",serif;
  --sans:"Jost","Futura",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{
  position:relative;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
}
/* paper grain */
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .11  0 0 0 0 .08  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.16;mix-blend-mode:multiply;
}
body::after{ /* soft warm vignette, like a printed page */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(120,90,60,.07) 100%);
}

/* status bar */
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 34px}
.time{font-family:var(--sans);font-weight:500;font-size:16px;letter-spacing:.02em}
.sys{display:block}

/* masthead */
.mast{position:absolute;top:56px;left:24px;right:24px}
.scotch{height:6px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;padding-top:30px}
h1{font-weight:400;font-size:78px;line-height:.92;letter-spacing:-.03em;font-variation-settings:"opsz" 96}
.count{display:flex;align-items:baseline;gap:7px}
.count em{font-style:italic;font-size:54px;line-height:.8;color:var(--ox);font-variation-settings:"opsz" 96}
.count span{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}

/* add line */
.add{position:absolute;top:188px;left:24px;right:24px;height:54px;display:flex;align-items:center;border-bottom:1px solid var(--ink)}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ink);padding:0}
.add input::placeholder{color:var(--mute)}
.add button{flex:none;height:44px;min-width:64px;padding:0 0 0 16px;border:0;background:transparent;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ox);font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}

/* list */
.list{position:absolute;top:256px;left:24px;right:24px}
.group + .group{margin-top:14px}
h2{display:flex;align-items:center;gap:10px;height:30px;font-weight:400}
h2 i{font-style:italic;font-size:16px;color:var(--ox);font-variation-settings:"opsz" 20;min-width:18px}
h2 span{font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
h2 .hr{flex:1;height:1px;background:var(--rule)}
h2 svg{flex:none;color:var(--ink2)}
ul{list-style:none}
li{display:flex;align-items:center;height:48px;gap:14px}
.box{flex:none;width:19px;height:19px;border:1.3px solid var(--ink);position:relative}
.name{font-size:22px;line-height:1;white-space:nowrap;font-variation-settings:"opsz" 28}
.lead{flex:1;height:4px;align-self:center;transform:translateY(5px);
  background:radial-gradient(circle,var(--mute) .85px,transparent 1.15px) 0 50%/6px 4px repeat-x}
.qty{font-style:italic;font-size:17px;color:var(--ink2);white-space:nowrap;font-variation-settings:"opsz" 18}

/* done */
.done{margin-top:12px}
h3{display:flex;align-items:center;gap:12px;height:30px;font-weight:400}
h3::before,h3::after{content:"";flex:1;height:1px;background:var(--rule)}
h3 span{font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
h3 i{font-style:italic;font-size:17px;color:var(--ox);margin-left:-4px}
.got{height:44px}
.got .box{border-color:var(--mute)}
.got .box svg{position:absolute;left:-3px;top:-9px;overflow:visible}
.got .name{color:var(--mute);text-decoration:none;padding:0 3px;margin-left:-3px;background:linear-gradient(var(--ox),var(--ox)) 0 60%/100% 1.4px no-repeat}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:34px;height:52px;display:flex;padding:0 24px}
.tabs::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:var(--ink)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:6px;color:var(--mute);text-decoration:none}
.tabs a span{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;padding-left:.24em;position:relative}
.tabs a.on{color:var(--ink)}
.tabs a.on span::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:2px;margin-left:-9px;background:var(--ox)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style>
</head>
<body>

<div class="status">
  <span class="time">9:41</span>
  <svg class="sys" width="74" height="14" viewBox="0 0 74 14" fill="none">
    <g fill="#231E1A">
      <rect x="1" y="9" width="2.2" height="3.6"/>
      <rect x="5.2" y="6.6" width="2.2" height="6"/>
      <rect x="9.4" y="4.2" width="2.2" height="8.4"/>
      <rect x="13.6" y="1.6" width="2.2" height="11"/>
    </g>
    <g stroke="#231E1A" stroke-width="1.4" stroke-linecap="round">
      <path d="M28.2 9.6a3.3 3.3 0 0 1 4.6 0"/>
      <path d="M25.7 7.1a6.8 6.8 0 0 1 9.6 0"/>
      <path d="M23.2 4.6a10.3 10.3 0 0 1 14.6 0"/>
    </g>
    <circle cx="30.5" cy="12" r="1.1" fill="#231E1A"/>
    <rect x="45.5" y="1.8" width="24" height="10.6" rx="2.6" stroke="#231E1A" stroke-width="1"/>
    <rect x="47.5" y="3.8" width="17" height="6.6" rx="1.2" fill="#231E1A"/>
    <path d="M71.6 5.6v3" stroke="#231E1A" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</div>

<header class="mast">
  <div class="scotch"></div>
  <div class="titlerow">
    <h1>Market</h1>
    <div class="count"><em>5</em><span>kaldı</span></div>
  </div>
</header>

<form class="add" onsubmit="return false">
  <input type="text" placeholder="Ne alacaksın?" aria-label="Ne alacaksın?">
  <button type="submit">Ekle
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h23.5M19.5 1.5L24.5 6l-5 4.5"/></svg>
  </button>
</form>

<main class="list">
  <section class="group">
    <h2><i>01</i><span>Manav</span><b class="hr"></b>
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7.6c-2.2 0-2.6 2-2.3 3.6-2.1 1.5-3.1 3.9-2.4 6.3C8 19.9 10 21 12 21s4-1.1 4.7-3.5c.7-2.4-.3-4.8-2.4-6.3.3-1.6-.1-3.6-2.3-3.6z"/>
        <path d="M12 7.6c0-1.6.4-2.9 1.3-3.9"/>
        <path d="M12.9 5.3c1.4-1.6 3.6-1.9 4.9-1-1 1.6-3.3 2.1-4.9 1z"/>
        <path d="M10.2 14.2c-.5.9-.6 2-.2 3" opacity=".6"/>
      </svg>
    </h2>
    <ul>
      <li><b class="box"></b><span class="name">Domates</span><span class="lead"></span><span class="qty">1 kg</span></li>
      <li><b class="box"></b><span class="name">Muz</span><span class="lead"></span><span class="qty">6 adet</span></li>
    </ul>
  </section>

  <section class="group">
    <h2><i>02</i><span>Kahvaltılık</span><b class="hr"></b>
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.9 12c0-4.4 2-8.4 4.1-8.4s4.1 4 4.1 8.4"/>
        <path d="M6.4 12h11.2c0 3.2-2.4 5.3-5.6 5.3S6.4 15.2 6.4 12z"/>
        <path d="M12 17.3v2.1M8.8 20.4h6.4"/>
        <path d="M10.4 6.8c.3-.8.7-1.4 1.1-1.8" opacity=".6"/>
      </svg>
    </h2>
    <ul>
      <li><b class="box"></b><span class="name">Süt</span><span class="lead"></span><span class="qty">2</span></li>
      <li><b class="box"></b><span class="name">Yumurta</span><span class="lead"></span><span class="qty">30'lu</span></li>
    </ul>
  </section>

  <section class="group">
    <h2><i>03</i><span>Temizlik</span><b class="hr"></b>
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.3 3h3.4v2.6"/>
        <path d="M10.3 3v2.6M9.4 5.6h5.2L16 9v11.2c0 .5-.4.8-.9.8H8.9c-.5 0-.9-.3-.9-.8V9z"/>
        <path d="M8 12.4h8M8 17.2h8"/>
        <circle cx="18.9" cy="5.2" r="1.6"/>
        <circle cx="20.4" cy="8.7" r=".9"/>
      </svg>
    </h2>
    <ul>
      <li><b class="box"></b><span class="name">Bulaşık deterjanı</span></li>
    </ul>
  </section>

  <section class="done">
    <h3><span>Alındı</span><i>2</i></h3>
    <ul>
      <li class="got"><b class="box"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M3.5 14.5c1.9 1 3.6 2.9 5 5.6C11.2 12.9 16 6.6 24 2.5" stroke="#7C2332" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></b><span class="name">Ekmek</span></li>
      <li class="got"><b class="box"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M3.8 14c1.8 1.2 3.4 3.2 4.8 6C11.4 13.2 15.8 6.4 23.6 3" stroke="#7C2332" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></b><span class="name">Beyaz peynir</span></li>
    </ul>
  </section>
</main>

<nav class="tabs">
  <a class="on" href="#">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.4 11C7.4 5.2 18.6 5.2 18.6 11"/>
      <path d="M3.8 11h18.4"/>
      <path d="M5.2 11l1.9 11h11.8l1.9-11"/>
      <path d="M9.6 11l.8 11M13 11v11M16.4 11l-.8 11M5.9 15.2h14.2M6.6 19h12.8" opacity=".5"/>
    </svg>
    <span>Market</span>
  </a>
  <a href="#">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.4 3.6h8c.6 0 1 .4 1 1v8L12.5 22.5c-.4.4-1 .4-1.4 0l-7.6-7.6c-.4-.4-.4-1 0-1.4z"/>
      <circle cx="18.2" cy="7.8" r="1.6"/>
      <path d="M8.6 14.6l4.8 4.8" opacity=".55"/>
    </svg>
    <span>İstekler</span>
  </a>
</nav>
<div class="home"></div>

</body>
</html>
