<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>İstekler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Onest:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0E;
  --tile:#1D1D21;
  --tile2:#26262B;
  --txt:#F4F2EE;
  --mute:#A3A09A;
  --lime:#C9F53B;
  --orange:#FF5B1F;
  --cobalt:#2D4BF5;
  --pink:#FF7BC8;
  --violet:#6C4BFF;
  --ink:#0C0C0E;
  --disp:"Unbounded","Onest",sans-serif;
  --body:"Onest",sans-serif;
  --r:24px;
  --gap:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--body);-webkit-font-smoothing:antialiased;position:relative}

.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 36px}
.time{font-family:var(--body);font-weight:600;font-size:17px}

.grid{position:absolute;top:58px;left:12px;right:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap);
  grid-template-rows:104px 92px 52px 201px 201px;
  grid-template-areas:"ti ti ti ti ti ti" "to to to to to to" "f1 f1 f2 f2 f3 f3" "a a a a b b" "c c d d d d"}
.t{border-radius:var(--r);position:relative;overflow:hidden}
.title{grid-area:ti;background:var(--tile);padding:0 20px 18px;display:flex;align-items:flex-end;justify-content:space-between}
.title h1{font-family:var(--disp);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em}
.title span{font-size:16px;color:var(--mute);font-weight:500;padding-bottom:4px}
.total{grid-area:to;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.total small{font-size:16px;font-weight:600}
.total b{font-family:var(--disp);font-weight:700;font-size:44px;letter-spacing:-.04em;line-height:1}
.filters{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.filters a{border-radius:18px;background:var(--tile);color:var(--txt);display:grid;place-items:center;text-decoration:none;font-size:16px;font-weight:500}
.filters a.on{background:var(--txt);color:var(--ink);font-weight:600}

.item{padding:14px 14px 16px;display:flex;flex-direction:column}
.tag{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap}
.item h3{font-size:18px;font-weight:600;line-height:1.15}
.item .st{font-size:15px;font-weight:500;opacity:.8;margin-top:2px}
.item .p{font-family:var(--disp);font-weight:700;letter-spacing:-.03em;line-height:1}
.item .art{flex:none}
.wide .body{margin-top:auto}
.wide .p{font-size:36px;margin-top:10px}
.wide .art{position:absolute;right:10px;top:8px}
.narrow .art{margin:6px auto 0}
.narrow .body{margin-top:auto}
.narrow .p{font-size:20px;margin-top:8px}

.a{grid-area:a;background:var(--orange);color:var(--ink)}
.b{grid-area:b;background:var(--pink);color:var(--ink)}
.c{grid-area:c;background:var(--violet);color:#fff}
.d{grid-area:d;background:var(--cobalt);color:#fff}

/* tabs */
.tabs{position:absolute;left:12px;right:12px;bottom:30px;height:64px;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tabs a{border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-family:var(--disp);font-weight:500;font-size:14px;color:var(--mute);background:var(--tile)}
.tabs a.on{background:var(--txt);color:var(--ink)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--txt)}
</style>
</head>
